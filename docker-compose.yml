services:
  question_generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/sujalgawas/question_generator/question_generator:latest
    container_name: question_generator
    env_file:
      - .env
    volumes:
      - .:/app
    ports: 
      - "8083:8083"
    networks:
      - tunnel_network
    restart: unless-stopped

  interviewer:
    build:
      context: ./interviewer
      dockerfile: Dockerfile
    image: ghcr.io/sujalgawas/question_generator/interviewer:latest
    container_name: interviewer
    env_file:
      - .env
    volumes:
      - ./interviewer:/app
      - ./adminServiceKey.json:/app/adminServiceKey.json:ro
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    ports:
      - "8086:8000"
    networks:
      - tunnel_network
    restart: unless-stopped


  gateway:
    image: nginx:alpine
    container_name: gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    networks:
      - tunnel_network
    depends_on:
      - question_generator
      - interviewer
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok1
    command: http gateway:80 --domain=josh-preintellectual-vasiliki.ngrok-free.dev
    env_file:
      - .env.ngrok
    ports:
      - "4041:4040"
    networks:
      - tunnel_network
    depends_on:
      - gateway
    restart: unless-stopped

networks:
  tunnel_network:
    driver: bridge
