worker_processes auto;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout 65;

    # Allow larger payloads (e.g. PDF resume uploads and audio data)
    client_max_body_size 50M;

    # Docker internal DNS resolver (resolves container IPs dynamically)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Map for WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Map for Forwarded Proto (handles ngrok / SSL termination)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Diagnostic header confirming gateway reached
        add_header X-Gateway "Antigravity-Proxy" always;

        # ----------------------------------------------------
        # Gateway Self-Check (Does not depend on any upstream)
        # ----------------------------------------------------
        location /gateway/health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}\n';
        }

        # ----------------------------------------------------
        # Interviewer Service (FastAPI + WebSockets)
        # Handles: /interview, /interviews, /resume,
        #          /submit, /review, /reviews, /tts
        # ----------------------------------------------------
        location /interview {
            set $interviewer_backend "http://interviewer:8000";
            proxy_pass $interviewer_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Extended timeouts for WebSocket interview sessions
            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /interviews {
            set $interviewer_backend "http://interviewer:8000";
            proxy_pass $interviewer_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /resume {
            set $interviewer_backend "http://interviewer:8000";
            proxy_pass $interviewer_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /submit {
            set $interviewer_backend "http://interviewer:8000";
            proxy_pass $interviewer_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /review {
            set $interviewer_backend "http://interviewer:8000";
            proxy_pass $interviewer_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /reviews {
            set $interviewer_backend "http://interviewer:8000";
            proxy_pass $interviewer_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /tts {
            set $interviewer_backend "http://interviewer:8000";
            proxy_pass $interviewer_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ----------------------------------------------------
        # Question Generator Service (Flask Backend)
        # All other endpoints (/signup, /login, /generate-paper,
        # /submit-test-result, /health, etc.)
        # ----------------------------------------------------
        location / {
            set $question_generator_backend "http://question_generator:8083";
            proxy_pass $question_generator_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
